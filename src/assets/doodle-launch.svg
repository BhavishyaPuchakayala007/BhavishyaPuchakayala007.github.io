<style>@keyframes go0 { 0%, 8% { fill: #f8f7f4; } 9%, 97% { fill: #2e90fa; } 100% { fill: #f8f7f4; } } .s0 { animation: go0 6.5s linear infinite; } @keyframes go1 { 0%, 20% { fill: #f8f7f4; } 21%, 97% { fill: #2e90fa; } 100% { fill: #f8f7f4; } } .s1 { animation: go1 6.5s linear infinite; } @keyframes go2 { 0%, 32% { fill: #f8f7f4; } 33%, 97% { fill: #2e90fa; } 100% { fill: #f8f7f4; } } .s2 { animation: go2 6.5s linear infinite; } @keyframes go3 { 0%, 44% { fill: #f8f7f4; } 45%, 97% { fill: #2e90fa; } 100% { fill: #f8f7f4; } } .s3 { animation: go3 6.5s linear infinite; } @keyframes go4 { 0%, 56% { fill: #f8f7f4; } 57%, 97% { fill: #2e90fa; } 100% { fill: #f8f7f4; } } .s4 { animation: go4 6.5s linear infinite; } @keyframes liftoff { 0% { transform: translate(0, 0); opacity: 0; } 4% { opacity: 1; } 60% { transform: translate(0, 0); } 63% { transform: translate(1px, 0); } 66% { transform: translate(-1px, -1px); } 69% { transform: translate(1px, -2px); animation-timing-function: cubic-bezier(.55, 0, .9, .45); } 96% { transform: translate(0, -200px); opacity: 1; } 100% { transform: translate(0, -200px); opacity: 0; } } .rocket { animation: liftoff 6.5s linear infinite; } @keyframes burn { 0%, 57% { opacity: 0; } 60%, 100% { opacity: 1; } } .burn { animation: burn 6.5s linear infinite; } @keyframes flicker { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(.9, 1.18); } } .flame { transform-box: fill-box; transform-origin: 50% 0%; animation: flicker .3s ease-in-out infinite; } .f1 { animation-duration: .22s; } @keyframes billow { 0%, 57% { opacity: 0; transform: scale(.4); } 70% { opacity: .95; transform: scale(1); } 100% { opacity: 0; transform: scale(1.5); } } .cloud { transform-box: fill-box; transform-origin: 50% 100%; animation: billow 6.5s ease-out infinite; } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
